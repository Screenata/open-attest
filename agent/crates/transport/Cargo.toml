[package]
name = "open-attest-transport"
version = "0.8.1"
edition = "2021"

[dependencies]
open-attest-types = { path = "../types" }
serde_json = "1"
anyhow = "1"
base64 = "0.22"

# On Windows, use native-tls (SChannel) so the OS certificate store and
# system proxy settings are honoured.  Other platforms keep rustls.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
base64 = "0.22"
